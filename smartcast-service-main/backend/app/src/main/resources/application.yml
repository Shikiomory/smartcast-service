server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/smartcast_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # update автоматически создаст или обновит таблицы в БД на основе JPA сущностей
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB


s3:
  endpoint: https://storage.yandexcloud.net # можно поставить адресс провайдера это заглушка
  access-key: YOUR_ACCESS_KEY
  secret-key: YOUR_SECRET_KEY
  bucket-name: smartcast-podcasts
  region: ru-central1