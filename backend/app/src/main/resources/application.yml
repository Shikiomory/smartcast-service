server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: lax
        secure: false

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

keycloak:
  internal-url: ${KEYCLOAK_INTERNAL_URL:http://127.0.0.1:8180}
  external-url: ${KEYCLOAK_EXTERNAL_URL:http://localhost:8180}
  admin:
    server-url: ${keycloak.internal-url}
    realm: smartcast
    client-id: smartcast-admin
    client-secret: SHOCgvs6fkpTVTf2NDXNfa3Omk73VnK3srgkaMVbhoSKLLOJ8oCF0RRJvAF3Y4EqAFWwEXnO7x7zJltSU8fXYO

spring:
  config:
    import: classpath:application-media.yml
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.external-url}/realms/smartcast
          jwk-set-uri: ${keycloak.internal-url}/realms/smartcast/protocol/openid-connect/certs
      client:
        provider:
          keycloak:
            issuer-uri: ${keycloak.external-url}/realms/smartcast
        registration:
          keycloak:
            client-id: smartcast-client
            client-secret: CHANGE_ME_SECRET
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/SmartCast}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:smartcast_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
