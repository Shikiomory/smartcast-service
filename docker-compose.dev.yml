services:

  smartcast-backend:
    build:
      context: ./backend
    container_name: smartcast-backend-dev

    ports:
      - "8080:8080"

    depends_on:
      keycloak:
        condition: service_healthy

    volumes:
      - ./backend:/app
      - ~/.m2:/root/.m2

    command: sh -c "./mvnw install -DskipTests && ./mvnw spring-boot:run -pl app"

    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080
      - KEYCLOAK_EXTERNAL_URL=http://localhost:8180
      - FRONTEND_URL=http://localhost:5173

  smartcast-frontend:
    build:
      context: ./frontend
    container_name: smartcast-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: smartcast-keycloak
    command: start-dev --import-realm

    ports:
      - "8180:8080"

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HEALTH_ENABLED: "true"

    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - keycloak_data:/opt/keycloak/data

    restart: unless-stopped


  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-dev
    ports:
      - "9000:9000" # порт для s3
      - "9001:9001" # порт для консоли управления
    environment:
      - RUSTFS_ACCESS_KEY=admin123
      - RUSTFS_SECRET_KEY=password123
    volumes:
      - rustfs_data:/data

    restart: unless-stopped

volumes:
  keycloak_data:
  rustfs_data: