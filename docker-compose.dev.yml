services:

  smartcast-backend:
    build:
      context: ./backend
    container_name: smartcast-backend-dev

    ports:
      - "8080:8080"

    depends_on:
      - keycloak

    volumes:
      - ./backend:/app
      - ~/.m2:/root/.m2

    command: sh -c "./mvnw install -DskipTests && ./mvnw spring-boot:run -pl app"

    environment:
      - SPRING_PROFILES_ACTIVE=dev

  smartcast-frontend:
    build:
      context: ./frontend
    container_name: smartcast-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: smartcast-keycloak
    command: start-dev --import-realm

    ports:
      - "8180:8080"

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"

    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - keycloak_data:/opt/keycloak/data

    restart: unless-stopped

volumes:
  keycloak_data: