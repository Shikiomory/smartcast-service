services:

  smartcast-backend:
    build:
      context: ./backend
    container_name: smartcast-backend-dev

    ports:
      - "8080:8080"

    volumes:
      - ./backend:/app
      - ~/.m2:/root/.m2

    command: sh -c "./mvnw install -DskipTests && ./mvnw spring-boot:run -pl app"

    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://postgres:5432/SmartCast
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-smartcast_dev}

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: SmartCast
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartcast_dev}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/app/src/main/resources/db/changelog/changes/001-create-base-schema.sql:/docker-entrypoint-initdb.d/001-create-base-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
